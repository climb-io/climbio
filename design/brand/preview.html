<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climbio 品牌預覽</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#08263a;background:#f7f9fb}
*{box-sizing:border-box}body{margin:0;padding:32px 22px;max-width:940px;margin-inline:auto}
h1{font-size:clamp(24px,6vw,48px);margin:0 0 8px}
h2{font-size:16px;margin:0 0 12px}
section{background:#fff;border:1px solid #e1e9ed;border-radius:22px;padding:20px;margin:22px 0}
section.dark{background:#0e1722;border-color:#0e1722;color:#f2f2f0}
section.indoor{background:#0e0e0f;border-color:#0e0e0f;color:#f2f2f0}
.word{display:block;width:100%;max-width:560px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:24px}
.mark{width:160px}
.icon{height:120px;width:120px;border-radius:24px}
.cat{width:120px;height:120px}
.sw{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:12px}
.sw i{width:60px;height:60px;border-radius:12px;display:block;border:1px solid #999}
</style>
<h1>Climbio 品牌</h1>
<p>正式產品為岩點貓、紅點貓與 Climbio Studio；Studio 沿用 Climbio 母品牌標誌。</p>
<section><h2>母品牌</h2><div class="row"><img class="mark" src="logo/climbio-mark.svg" alt="Climbio"><img class="mark" src="logo/climbio-stacked.svg" alt="Climbio 直式"><img class="mark" src="logo/climbio-mark-monochrome.svg" alt="Climbio 單色"></div><img class="word" src="logo/climbio-horizontal-light.svg" alt="Climbio 橫式"></section>
<section class="dark"><img class="word" src="logo/climbio-horizontal-dark.svg" alt="Climbio 深底橫式"></section>
<section><div class="row"><img class="icon" src="icons/app-icon-light.svg" alt="App Icon"><img class="icon" src="icons/app-icon-maskable.svg" alt="Maskable App Icon"></div></section>
<section class="indoor"><h2>室內：岩點貓</h2><div class="row"><img class="cat" src="cats/hold-cat.svg" alt="岩點貓"><img class="icon" src="cats/icons/hold-cat-app-icon.svg" alt=""></div><img class="word" src="cats/hold-cat-wordmark.svg" alt="岩點貓 App 的橫式 Logo"></section>
<section><h2>戶外：紅點貓</h2><div class="row"><img class="cat" src="cats/redpoint-cat.svg" alt="紅點貓"><img class="icon" src="cats/icons/redpoint-cat-app-icon.svg" alt=""></div></section>
<section><div class="row">
<div class="sw"><i style="background:#b6f000"></i>母品牌綠<br>#B6F000</div>
<div class="sw"><i style="background:#0fadea"></i>母品牌藍<br>#0FADEA</div>
<div class="sw"><i style="background:#a4dc2a"></i>室內 Logo<br>#A4DC2A</div>
<div class="sw"><i style="background:#d4ff4f"></i>室內操作色<br>#D4FF4F</div>
<div class="sw"><i style="background:#0b4a6b"></i>戶外主色<br>#0B4A6B</div>
<div class="sw"><i style="background:#2e8cc9"></i>戶外背層<br>#2E8CC9</div>
</div></section>
</html>
