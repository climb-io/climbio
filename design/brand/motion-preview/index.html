<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climbio 果凍岩點貓 · 動畫預覽</title><link rel="stylesheet" href="preview.css">
<body><main><header><img src="../cats/hold-cat.svg" alt="Climbio 岩點貓"><div><small>CLIMBIO · MOTION STUDY</small><h1>果凍岩點貓</h1></div><span class="tag">階段一</span></header>
<section class="viewer" aria-label="動畫預覽"><div class="stage" id="stage"></div><div class="caption"><b id="title"></b><span id="duration"></span></div><p id="description"></p></section>
<section class="controls" aria-label="播放控制"><label>情境<select id="scenario"></select></label><label id="variantLabel">狀態<select id="variant"></select></label>
<div class="row"><button id="sent">Sent ✓</button><button id="flash">Flash ϟ</button><button id="compare" aria-pressed="false">並排比較</button></div>
<div class="row"><label>速度<select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><label class="check"><input id="reduced" type="checkbox">減少動態</label></div>
<label class="timeline">時間軸 <output id="time">0.00 s</output><input id="seek" type="range" min="0" max="1" step="0.001" value="0"></label>
<div class="row"><button id="pause">暫停</button><button id="cancel">取消</button><button id="replay" class="primary">重播</button></div><p id="playState" role="status" aria-live="polite">準備完成</p></section>
<section class="sizes"><h2>正式造型 · 尺寸對照</h2><div id="sizes"></div></section><footer>獨立預覽 · 無資料寫入 · <a href="../cats/hold-cat.svg">正式 SVG</a></footer></main><script type="module" src="preview.js"></script></body></html>
