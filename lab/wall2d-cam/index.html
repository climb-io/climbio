<!doctype html>
<html lang="zh-Hant" data-climbio-theme="indoor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script src="../../host-redirect.js"></script>
<script src="./boot.js"></script>
<title>Climbio Lab · 2D 牆相機即時追蹤</title>
<meta name="description" content="2D 平面牆面照片與岩點外框的瀏覽器本機相機即時偵測與疊線實驗。">
<link rel="icon" href="../../icons/brand/favicon-64.png">
<link rel="stylesheet" href="../../css/brand-tokens.css">
<link rel="stylesheet" href="../../appkit/ui.css">
<link rel="stylesheet" href="../../arkit/view.css">
<link rel="stylesheet" href="./style.css">
<link rel="modulepreload" href="./app.js">
<link rel="modulepreload" href="../../arkit/view.js">
<link rel="modulepreload" href="../../arkit/geometry.js">
<link rel="modulepreload" href="../../arkit/tracking-log.js">
<link rel="modulepreload" href="../../arkit/overlay.js">
<link rel="modulepreload" href="../../arkit/camera.js">
<script type="module" src="./app.js"></script>
</head>
<body data-arkit data-tools="closed" data-running="false" data-located="false">
<button id="tools-toggle" type="button" aria-expanded="false" aria-controls="controls-header controls-footer">工具</button>
<header id="controls-header">
  <strong>2D 相機追蹤</strong>
  <div class="controls-selects">
    <select id="wall-select" aria-label="目標牆面"></select>
    <select id="route-select" aria-label="顯示路線"></select>
  </div>
</header>
<main id="stage">
  <video id="live-video" muted playsinline autoplay></video>
  <canvas id="live-preview"></canvas>
  <canvas id="overlay-canvas"></canvas>
  <div id="ar-reticle" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
  <div id="hud">
    <span id="status" role="status" aria-live="polite">載入牆面資料…</span>
    <span><b id="fps">—</b> <b id="hz">—</b> <b id="latency">—</b> <b id="inliers">—</b></span>
  </div>
</main>
<footer id="controls-footer">
  <div class="primary-row">
    <button class="btn primary" id="camera-toggle" type="button" disabled>開啟相機</button>
    <button class="btn" id="sim-toggle" type="button" disabled>模擬測試</button>
  </div>
  <select id="camera-device" aria-label="鏡頭" hidden></select>
  <div class="actions">
    <button class="btn" id="pick-media-btn" type="button" disabled>測試照片／影片</button>
    <input id="pick-media-input" type="file" accept="image/*,video/*" hidden>
    <button class="btn" id="outline-toggle" type="button" aria-pressed="false">除錯外框</button>
    <button class="btn" id="mark-drift" type="button" disabled>標記偏移</button>
    <button class="btn" id="mark-loss" type="button" disabled>標記掉點</button>
    <button class="btn" id="copy-log" type="button">複製紀錄</button>
  </div>
  <div id="notice" role="status" aria-live="polite"></div>
</footer>
<dialog id="log-dialog">
  <textarea id="log-text" readonly aria-label="測試紀錄"></textarea>
  <div class="actions">
    <button class="btn" id="download-log" type="button">下載紀錄</button>
    <button class="btn" id="close-log" type="button">關閉</button>
  </div>
</dialog>
</body>
</html>
