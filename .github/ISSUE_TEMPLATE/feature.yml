name: 功能／設計提案 Feature or design proposal
description: 新功能、改變操作或預設值、改開放格式或 Kit 的公開 API，動手寫之前先提 / Propose before coding a new feature, a changed default, or a format / public API change
labels: [proposal, needs-product-decision]
body:
  - type: markdown
    attributes:
      value: |
        錯字、翻譯、有重現方式的 Bug 不用先提案，直接送 PR（見 CONTRIBUTING）。這裡是要先取得決定的改動。
        Typos, translations and reproducible bugs don't need a proposal; send a PR (see CONTRIBUTING). Use this for changes that need a decision first.
  - type: dropdown
    id: scope
    attributes:
      label: 影響範圍 Scope
      multiple: true
      options:
        - 岩點貓 Hold Cat
        - 紅點貓 Redpoint Cat
        - Climbio Studio
        - 開放格式 Open format (format/)
        - Kit 的公開 API / Public Kit API
        - 儲存、同步、離線 Storage, sync, offline
        - 其他 Other
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: 使用情境 Who needs this and when
      description: 誰、在什麼情況下、現在怎麼做、哪裡不方便 / Who, in what situation, what they do today, what is hard
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 現在的規格 Current behavior
      description: 相關的 docs、Kit README 或畫面 / Link the relevant docs, Kit README or screens
  - type: textarea
    id: proposal
    attributes:
      label: 建議的做法 Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他做法 Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: 對資料與 API 的影響 Data and API impact
      description: 會不會改開放格式、公開 API、儲存或同步的語意？相容嗎（語意版本要升哪一位）？ / Does it change the format, a public API, storage or sync? Is it compatible (which semver part)?
    validations:
      required: true
  - type: dropdown
    id: poc
    attributes:
      label: 可以先做不破壞現有行為的試做嗎？ Can a non-breaking proof of concept come first?
      options:
        - 可以 Yes
        - 不行 No
        - 不確定 Not sure
