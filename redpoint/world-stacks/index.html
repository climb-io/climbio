<!doctype html>
<html lang="zh-Hant" data-climbio-theme="outdoor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>法國卡堆實驗｜紅點貓</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../../icons/cats/redpoint-cat-192.png">
<link rel="stylesheet" href="../../css/brand-tokens.css">
<link rel="stylesheet" href="../../appkit/ui.css">
<style>
:root { --stack-shadow: rgba(8,38,58,.18); --paper:var(--brand-bg); --ink:var(--brand-text); --quiet:var(--brand-text-muted); --edge:var(--brand-line-strong); --blue:var(--brand-action); font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif; }
* { box-sizing:border-box; }
body { margin:0; min-height:100dvh; background:var(--paper); color:var(--ink); }
button,a { font:inherit; }
button { cursor:pointer; }
button:focus-visible,a:focus-visible { outline:3px solid var(--brand-layer); outline-offset:5px; }
button:active:not(:disabled) { scale:.97; }
[hidden] { display:none!important; }
.shell { max-width:1160px; padding:22px 20px 48px; margin:auto; }
.topbar { display:flex; align-items:center; gap:12px; min-height:54px; }
.iconbutton { border:1px solid var(--brand-line); border-radius:50%; background:var(--brand-surface); width:42px; height:42px; display:grid; place-items:center; color:var(--blue); flex:none; }
.iconbutton svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.brand { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink); font-weight:800; letter-spacing:.02em; }
.brand img { height:32px; width:32px; object-fit:contain; }
.testmark { margin-left:auto; color:var(--quiet); border:1px solid var(--brand-line); background:var(--brand-surface); padding:5px 10px; border-radius:999px; font-size:12px; font-weight:650; }
.intro { padding:28px 4px 18px; max-width:750px; }
.eyebrow { color:var(--blue); font-size:13px; letter-spacing:.08em; font-weight:800; }
h1 { font-size:clamp(30px,5vw,50px); letter-spacing:-.035em; line-height:1.2; margin:8px 0 10px; }
.intro p { margin:0; color:var(--quiet); max-width:660px; line-height:1.6; font-size:15px; }
.crumb { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:0 0 18px; font-size:13px; color:var(--quiet); }
.crumb button { border:0; color:var(--blue); background:transparent; padding:5px 0; font-weight:700; }
.crumb .current { color:var(--ink); font-weight:800; }
.canvas { position:relative; min-height:400px; isolation:isolate; overflow:visible; }
.canvas::before { content:""; position:absolute; inset:6px 0 12px; border-radius:30px; pointer-events:none; background:radial-gradient(ellipse at 50% 34%,rgba(78,147,180,.13),transparent 68%),linear-gradient(155deg,rgba(255,255,255,.82),rgba(220,232,240,.5)); }
.canvas::after { content:""; position:absolute; left:6%; right:6%; bottom:10px; height:35px; background:radial-gradient(ellipse,rgba(10,57,81,.12),transparent 73%); pointer-events:none; }
.hero { display:flex; min-height:450px; align-items:center; justify-content:center; flex-direction:column; gap:25px; padding:36px 12px 30px; position:relative; }
.hero .pile { --pile-w:clamp(210px,40vw,320px); --pile-h:240px; transform:rotate(-3deg); }
.hero .pile:hover { transform:rotate(-1deg) translateY(-7px); }
.hero-foot { z-index:2; text-align:center; font-size:13px; line-height:1.5; color:var(--quiet); }
.hero-foot strong { display:block; color:var(--ink); font-size:17px; }
.pile { position:relative; width:var(--pile-w,205px); height:calc(var(--pile-h,160px) + 42px); flex:none; padding:0; border:0; background:transparent; text-align:left; isolation:isolate; transform:rotate(var(--tilt,-2deg)); transition:transform .38s cubic-bezier(.2,.85,.24,1); --layers:6; }
.pile:hover { transform:rotate(0deg) translateY(-7px); }
.pile .sheet { position:absolute; display:block; width:var(--pile-w,205px); height:var(--pile-h,160px); left:0; top:calc(var(--i) * 4px); transform:translateX(calc(var(--i) * 1.2px)); border:1px solid #b8cbd6; border-radius:15px; background:var(--brand-surface); box-shadow:0 3px 6px rgba(8,38,58,.09); }
.pile .sheet:nth-child(even) { background:#e2ebf1; }
.pile .face { position:absolute; z-index:2; left:0; top:0; width:var(--pile-w,205px); height:var(--pile-h,160px); background:var(--brand-surface); border:1px solid var(--edge); border-radius:15px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 11px 26px var(--stack-shadow); }
.pile .mosaic { display:grid; grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); gap:2px; min-height:0; flex:1; background:#d9e5eb; }
.pile .mosaic img { display:block; width:100%; height:100%; min-height:0; object-fit:cover; background:#dae3e9; }
.pile .info { padding:9px 12px 11px; background:var(--brand-surface); display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.pile .info strong { font-size:15px; line-height:1.2; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.pile .info small { color:var(--quiet); white-space:nowrap; font-weight:650; font-size:11.5px; }
.hero .pile .info { padding:14px 17px 16px; }
.hero .pile .info strong { font-size:23px; }
.hero .pile .info small { font-size:13px; }
.piles-wrap { padding:36px 24px 18px; position:relative; z-index:1; }
.regions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); column-gap:12px; row-gap:16px; justify-items:center; align-items:center; min-height:540px; }
.region-slot { min-width:0; display:flex; flex-direction:column; align-items:center; padding:9px 4px 13px; animation:appear .48s cubic-bezier(.18,.9,.25,1) backwards; }
.region-slot:nth-child(2) { animation-delay:55ms; }
.region-slot:nth-child(3) { animation-delay:110ms; }
.region-slot:nth-child(4) { animation-delay:165ms; }
.region-slot:nth-child(5) { animation-delay:220ms; }
.region-slot:nth-child(1) { transform:translate(-8px,-10px); }
.region-slot:nth-child(2) { transform:translate(18px,28px); }
.region-slot:nth-child(3) { transform:translate(-6px,5px); }
.region-slot:nth-child(4) { transform:translate(-22px,-18px); }
.region-slot:nth-child(5) { transform:translate(15px,16px); }
.region-slot .pile { --pile-w:clamp(145px,19vw,214px); --pile-h:163px; }
.region-slot p { margin:8px 0 0; color:var(--quiet); font-size:12px; text-align:center; }
.region-title { font-weight:800; margin:0 0 8px; padding:0 4px; font-size:16px; }
.region-label { color:var(--quiet); font-size:13px; margin:-3px 4px 14px; line-height:1.5; }
.results { padding:0 2px; animation:appear .25s ease-out both; }
.toolbar { position:sticky; z-index:4; top:0; background:color-mix(in srgb,var(--paper) 94%,transparent); padding:12px 0; display:flex; gap:12px; justify-content:space-between; align-items:center; border-bottom:1px solid var(--brand-line); margin-bottom:17px; }
.toolbar b { font-size:15px; }
.toolbar input { border:1px solid var(--edge); padding:10px 13px; border-radius:13px; color:var(--ink); background:var(--brand-surface); width:min(300px,55%); min-width:0; font-size:16px; }
.tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
.tile { display:flex; flex-direction:column; text-align:left; border:1px solid var(--brand-line); overflow:hidden; background:var(--brand-surface); border-radius:17px; padding:0; min-width:0; box-shadow:0 3px 10px rgba(8,38,58,.06); transition:transform .2s ease,box-shadow .2s ease; }
.tile:hover { transform:translateY(-3px); box-shadow:0 10px 20px rgba(8,38,58,.14); }
.tile-photo { width:100%; aspect-ratio:4 / 3; background:var(--brand-surface-2); position:relative; }
.tile-photo img { display:block; width:100%; height:100%; object-fit:cover; }
.tile-info { padding:10px 12px 12px; min-height:85px; }
.tile-info b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:14px; line-height:1.35; min-height:38px; overflow-wrap:anywhere; }
.tile-info span { display:block; color:var(--quiet); font-size:12px; margin-top:5px; }
.more { display:block; border:1px solid var(--edge); background:var(--brand-surface); padding:12px 24px; border-radius:100px; margin:28px auto; color:var(--blue); font-weight:800; }
.status { padding:50px 20px; color:var(--quiet); text-align:center; position:relative; z-index:3; }
.status button { padding:10px 18px; background:var(--brand-surface); color:var(--blue); border:1px solid var(--edge); border-radius:10px; }
.foot { text-align:center; color:var(--quiet); font-size:12px; margin:26px auto 0; line-height:1.6; max-width:730px; }
.preview { border:0; padding:0; width:min(660px,calc(100vw - 24px)); max-height:calc(100dvh - 36px); border-radius:22px; background:var(--brand-surface); color:var(--ink); overflow:auto; box-shadow:0 22px 64px rgba(8,38,58,.3); }
.preview::backdrop { background:rgba(8,38,58,.58); }
.preview .preview-inner { padding:17px; }
.preview-head { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px; }
.preview-head h2 { font-size:19px; margin:0; line-height:1.3; }
.preview-close { border:0; background:var(--brand-surface-2); border-radius:50%; width:38px; height:38px; flex:none; font-size:21px; }
.preview img { display:block; width:100%; height:auto; max-height:52dvh; object-fit:contain; border-radius:13px; background:var(--brand-surface-2); }
.preview p { color:var(--quiet); font-size:13px; }
.open-app { display:block; text-decoration:none; text-align:center; padding:13px; font-weight:800; background:var(--brand-action); color:var(--brand-on-action); border-radius:13px; margin-top:14px; }
@keyframes appear { from { opacity:0; translate:0 13px; scale:.96; } to { opacity:1; translate:0 0; scale:1; } }
@media (max-width:760px) {
 .shell { padding:12px 13px 40px; }
 .intro { padding:24px 5px 18px; }
 .canvas { min-height:355px; }
 .hero { min-height:365px; padding:24px 0 16px; }
 .hero .pile { --pile-w:clamp(218px,62vw,290px); --pile-h:210px; }
 .piles-wrap { padding:22px 5px 8px; }
 .regions { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:5px; column-gap:2px; min-height:0; }
 .region-slot { padding:5px 0 13px; }
 .region-slot .pile { --pile-w:clamp(135px,39vw,193px); --pile-h:137px; }
 .region-slot:nth-child(n) { transform:none; }
 .pile .info { padding:7px 8px 9px; gap:2px; flex-direction:column; }
 .pile .info strong { font-size:13px; }
 .pile .info small { font-size:11px; }
 .hero .pile .info { flex-direction:row; align-items:baseline; }
 .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
 .tile-info { padding:9px; }
 .toolbar { align-items:start; flex-direction:column; }
 .toolbar input { width:100%; }
 .testmark { font-size:11px; }
}
@media (prefers-reduced-motion:reduce) {
 *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}
</style>
</head>
<body>
<main class="shell">
 <header class="topbar">
  <button class="iconbutton" id="back" type="button" hidden aria-label="返回上一層"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <a href="../" class="brand" aria-label="返回紅點貓"><img src="../../icons/cats/redpoint-cat.svg" alt="">紅點貓</a>
  <span class="testmark">法國卡堆實驗</span>
 </header>
 <section class="intro" aria-live="polite"><div class="eyebrow">WORLD / EXPERIMENT</div><h1 id="heading">把世界攤開來</h1><p id="subheading">從一疊法國岩場開始，拆成地區卡堆，再展開每一張真正的岩場照片。</p></section>
 <nav class="crumb" id="crumb" aria-label="目前位置"></nav>
 <div id="content"><p class="status">正在讀取岩場索引…</p></div>
 <p class="foot" id="foot">獨立設計實驗頁，不修改目前的「世界」。圖片取用現有 OpenClimbing 縮圖，岩場資訊來自本站公開索引。</p>
</main>
<dialog class="preview" id="preview">
 <div class="preview-inner">
  <div class="preview-head"><h2 id="previewTitle"></h2><button type="button" class="preview-close" id="previewClose" aria-label="關閉">×</button></div>
  <img id="previewPhoto" alt="岩場預覽圖" loading="lazy">
  <p id="previewSummary"></p>
  <a class="open-app" id="openCrag" href="../">在紅點貓查看與收下</a>
 </div>
</dialog>
<script>
'use strict';
(() => {
  const $ = (s) => document.querySelector(s);
  const root = $('#content'), back = $('#back'), heading = $('#heading'), subtitle = $('#subheading');
  const demoName = '法國', photoRoot = 'https://huggingface.co/datasets/climbio/crags/resolve/main/openclimbing/';
  const regionNames = ['Fontainebleau','Yzeron','Les Roches qui dansent','Mont Botey','其他地區'];
  let crags = [], regions = [], state = { stage:0, region:'' }, shown = 0, matching = [], query = '';
  const photo = (id, file) => photoRoot + encodeURIComponent(id) + '/' + file;
  const previewUrl = (c) => photo(c.id, 'preview.jpg');
  const thumbUrl = (c) => photo(c.id, 'thumb.jpg');
  const count = (n) => String(n) + ' 個岩場';
  const numericName = (name) => /^[\d\s./–-]+$/.test(name || '');
  const displayName = (c) => numericName(c.n) && c.ap && c.ap[0] ? c.ap[0] + ' · ' + c.n : (c.n || c.ap?.[0] || '未命名岩場');
  const el = (tag, cls, value) => { const n = document.createElement(tag); if (cls) n.className = cls; if (value != null) n.textContent = value; return n; };
  const add = (parent, ...nodes) => { parent.append(...nodes); return parent; };
  const regionOf = (c) => {
    const area = c.ap?.[0] || '';
    if (area === 'Rocher Canon' || area === 'Roche aux Oiseaux') return 'Fontainebleau';
    if (area === 'Yzeron Bouldering') return 'Yzeron';
    if (area === 'Les Roches qui dansent') return area;
    if (area === 'Mont Botey Bouldering') return 'Mont Botey';
    return '其他地區';
  };
  const samples = (items, n) => {
    const filtered = items.filter((c) => c.pv);
    if (!filtered.length) return [];
    return Array.from({length:Math.min(n,filtered.length)}, (_,i) => filtered[Math.floor(i * filtered.length / Math.min(n,filtered.length))]);
  };
  function mosaic(items) {
    const grid = el('span','mosaic');
    const pics = samples(items,4);
    for (const c of pics) {
      const img = document.createElement('img');
      img.src = thumbUrl(c); img.alt = ''; img.loading = 'lazy'; img.decoding = 'async';
      img.addEventListener('error',() => { img.style.opacity = '0'; },{once:true});
      grid.append(img);
    }
    return grid;
  }
  function pile(items, title, onClick, hero = false) {
    const n = items.length, d = Math.min(8,Math.max(2,Math.floor(Math.log2(n + 1)) - 1));
    const b = el('button','pile' + (hero ? ' pile-main' : ''));
    b.type = 'button'; b.setAttribute('aria-label', title + '，' + count(n) + '，展開');
    b.title = title; b.style.setProperty('--layers',String(d));
    for (let i=d;i>=1;i--) {
      const layer = el('span','sheet'); layer.style.setProperty('--i',String(i));
      b.append(layer);
    }
    const face = el('span','face');
    const info = el('span','info');
    add(info,el('strong','',title),el('small','',count(n)));
    add(face,mosaic(items),info);
    add(b,face);
    b.addEventListener('click',onClick);
    return b;
  }
  function path(stage,region) {
    return stage === 0 ? location.pathname : stage === 1 ? '#france' : '#region=' + encodeURIComponent(region);
  }
  function navigate(stage,region = '',replace = false) {
    state = {stage,region}; query = '';
    const data = {...state};
    if (replace) history.replaceState(data,'',path(stage,region));
    else history.pushState(data,'',path(stage,region));
    render();
  }
  function renderCrumb() {
    const bar = $('#crumb'); bar.replaceChildren();
    const link = (text,stage,region='') => {const b = el('button','',text); b.type='button'; b.onclick=()=>navigate(stage,region); return b;};
    bar.append(link('世界',0));
    if (state.stage>0) add(bar,el('span','','/'),state.stage===1 ? el('span','current',demoName) : link(demoName,1));
    if (state.stage===2) add(bar,el('span','','/'),el('span','current',state.region));
  }
  function render() {
    back.hidden = state.stage === 0; renderCrumb(); root.replaceChildren();
    if (state.stage===0) {
      heading.textContent = '把世界攤開來';
      subtitle.textContent = '從法國開始試玩：點一疊卡片，拆成地區，再找到真正的岩場。';
      const scene = el('section','canvas hero');
      add(scene,pile(crags,demoName,()=>navigate(1),true));
      const note = el('div','hero-foot');
      add(note,el('strong','','法國 · ' + count(crags.length)),el('span','','卡堆厚度代表資料量；點開可查看各地區'));
      scene.append(note); root.append(scene); return;
    }
    if (state.stage===1) {
      heading.textContent = '法國，拆成幾疊';
      subtitle.textContent = '每一疊代表一組相近的攀岩地區，厚度表示岩場數量；不以單一岩壁照片代表整區。';
      const scene = el('section','canvas piles-wrap'), grid = el('div','regions');
      for (const g of regions) {
        const slot = el('div','region-slot');
        add(slot,pile(g.items,g.name,()=>navigate(2,g.name)),el('p','',g.name==='Fontainebleau'?'含 Rocher Canon、Roche aux Oiseaux':''));
        grid.append(slot);
      }
      scene.append(grid); root.append(scene); return;
    }
    const g = regions.find((r) => r.name === state.region);
    if (!g) { navigate(1,'',true); return; }
    heading.textContent = g.name;
    subtitle.textContent = '卡堆已展開成可辨識的岩場卡片。選照片可以查看預覽，再到紅點貓收下。';
    const results=el('section','results');
    const toolbar=el('div','toolbar');
    const label=el('b','','岩場照片 · ' + count(g.items.length));
    const input=el('input'); input.type='search'; input.placeholder='搜尋這一疊的岩場'; input.setAttribute('aria-label','搜尋岩場');
    input.value=query;
    input.addEventListener('input',() => { query=input.value.trim().toLocaleLowerCase(); fill(); });
    add(toolbar,label,input);
    const tiles=el('div','tiles'); tiles.id='tiles';
    const more=el('button','more','載入更多岩場'); more.type='button'; more.onclick=()=>appendCards();
    results.append(toolbar,tiles,more); root.append(results);
    function item(c) {
      const button=el('button','tile'); button.type='button'; button.setAttribute('aria-label','查看 ' + displayName(c));
      const figure=el('div','tile-photo');
      if(c.pv){ const img=document.createElement('img'); img.src=thumbUrl(c); img.alt=''; img.loading='lazy'; img.decoding='async'; img.onerror=()=>{img.hidden=true}; figure.append(img); }
      const info=el('div','tile-info');
      add(info,el('b','',displayName(c)),el('span','',(c.tc||0)+' 條 Topo 路線'));
      add(button,figure,info); button.onclick=()=>openPreview(c);
      return button;
    }
    function appendCards() {
      const next = matching.slice(shown,shown+18);
      for (const c of next) tiles.append(item(c));
      shown+=next.length;
      more.hidden = shown >= matching.length;
      if (!matching.length && !tiles.children.length) tiles.append(el('p','region-label','沒有符合的岩場'));
    }
    function fill() {
      matching = g.items.filter(c => !query || (displayName(c)+' '+(c.ap||[]).join(' ')).toLocaleLowerCase().includes(query));
      shown=0;tiles.replaceChildren();label.textContent = '岩場照片 · ' + count(matching.length);appendCards();
    }
    fill();
  }
  function openPreview(c) {
    const dialog=$('#preview'), img=$('#previewPhoto');
    $('#previewTitle').textContent=displayName(c);
    $('#previewSummary').textContent=(c.tc||0)+' 條 Topo 路線 · '+(c.pc||0)+' 張來源照片。預覽圖包含入口照片和縮圖。';
    img.removeAttribute('src'); img.alt=displayName(c)+' 的現有合成預覽';
    if(c.pv) img.src=previewUrl(c);
    const url='https://openclimbing.org/relation/'+encodeURIComponent(c.id);
    $('#openCrag').href='../?topo='+encodeURIComponent(url);
    if(!dialog.open) dialog.showModal();
  }
  $('#previewClose').addEventListener('click',()=>$('#preview').close());
  $('#preview').addEventListener('click',e=>{if(e.target.id==='preview')e.target.close();});
  back.addEventListener('click',()=>{if(state.stage===2)navigate(1);else if(state.stage===1)navigate(0);});
  window.addEventListener('popstate',e=>{
    const s=e.state;state=s&&[0,1,2].includes(s.stage)?s:{stage:0,region:''};query='';render();
  });
  fetch('https://huggingface.co/datasets/climbio/crags/resolve/main/openclimbing/index.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json();}).then(data=>{
    crags=(data.crags||[]).filter(c=>String(c.cc).toLowerCase()==='fr');
    regions=regionNames.map(name=>({name,items:crags.filter(c=>regionOf(c)===name)})).filter(g=>g.items.length);
    const hash=location.hash;
    const initial=hash.startsWith('#region=')?{stage:2,region:decodeURIComponent(hash.slice(8))}:hash==='#france'?{stage:1,region:''}:{stage:0,region:''};
    if(initial.stage===2&&!regions.some(g=>g.name===initial.region))initial.stage=1;
    navigate(initial.stage,initial.region,true);
    $('#foot').textContent='索引日期：'+(data.generated||'未提供')+'。本頁顯示 OpenClimbing 原始岩場筆數，尚未扣除正式 App 的合併下載包；圖片使用已產生的真實縮圖。此實驗頁不影響既有世界地圖。';
  }).catch(e=>{
    root.replaceChildren();
    const error=el('div','status');
    add(error,el('p','','無法讀取法國岩場索引（'+e.message+'）'),el('button','','重新載入'));
    error.querySelector('button').onclick=()=>location.reload();root.append(error);
  });
})();
</script>
</body>
</html>
