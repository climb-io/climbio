  </div>
</div>
<!-- 接收分享（全螢幕）：點了連結 → 開箱（出線者、照片由模糊變清楚、岩點數）→ 揭曉（岩點一顆顆亮起、難度落下、膠帶短句）→ 飛進路線圖 -->
<div class="recv-page" id="recvPage" role="dialog" aria-modal="true" data-i18n-aria="recvShare" aria-label="接收分享" hidden>
  <div class="rv-box" id="rvBox" hidden>
    <div class="rv-from"><span class="rv-av" id="rvAv"></span><span id="rvFrom"></span></div>
    <div class="rv-card" id="rvCard">
      <canvas id="rvPic"></canvas><canvas id="rvColor"></canvas>
      <div class="rv-title" id="rvTitle"><b id="rvGrade"></b><span id="rvName"></span></div>
      <span class="rv-tape" id="rvTape"></span>
    </div>
    <p class="rv-count"><b id="rvCount">0</b><span data-i18n="holdsUnit">顆岩點</span></p>
    <p class="rv-status" id="rvStatus" role="status"></p>
    <button class="btn primary rv-go" id="rvGo" hidden></button>
  </div>
  <!-- 掃到之後先問：誰傳來哪一條線，收下才開箱 -->
  <div class="rv-ask" id="rvAsk" hidden>
    <div class="rv-from"><span class="rv-av" id="rvAskAv"></span><span id="rvAskFrom"></span></div>
    <div class="rv-what"><b id="rvAskGrade"></b><span id="rvAskName"></span></div>
    <small id="rvAskWall"></small>
    <div class="rv-ask-btns"><button class="btn" id="rvAskNo" data-i18n="cancel">取消</button><button class="btn primary" id="rvAskYes" data-i18n="feedTake">收下</button></div>
  </div>
  <button class="vw-btn rv-x" id="rvClose" data-i18n-aria="close" aria-label="關閉"><svg><use href="#i-plus"/></svg></button>
</div>


<!-- 第一次使用的導覽：首次打開時顯示，看完或略過後不再出現；選單「使用說明」改為正式文件。 -->
<!-- 體驗版（瀏覽器裡、還沒加到主畫面）：首頁換成簡單的介紹＋加到主畫面的步驟；收到的線照樣能看，編輯類的功能換成下面這條 -->
<section class="landing" id="landing" hidden>
  <button class="vw-btn ld-x" id="ldClose" data-i18n-aria="close" aria-label="關閉"><svg><use href="#i-plus"/></svg></button>
  <header class="ld-bar"><svg class="wordmark" viewBox="0 0 1260 280" role="img" aria-label="岩點貓"><use href="#i-wordmark"/></svg><span class="env-badge" data-i18n="envDev"></span></header>
  <!-- 示範牆只用於開場動畫，不匯入使用者牆面。 -->
  <div class="ld-shot"><canvas id="ldShot" width="600" height="600"></canvas><span class="ld-tape" id="ldTape"></span></div>
  <h1 class="ld-title" id="ldTitle"></h1>   <!-- 主標、副標三組輪播（js/mobile.js 的 showPitch） -->
  <p class="ld-sub" id="ldSub"></p>
  <div class="ld-shared" id="ldSharedInfo" hidden><b data-i18n="pcSharedRoute">朋友分享的路線</b></div>
  <div class="ld-feats" id="ldFeats"></div>   <!-- 電腦：三組示範牆動畫配合文案（js/mobile.js 的 pcScenes），第四欄是連結卡。 -->
  <!-- 安裝說明（首頁下方的「加到主畫面」打開）：Android 按鈕或 ⋮ 說明、iPhone 一排三步、內建瀏覽器請用 Chrome／Safari -->
  <div class="ld-install" id="ldInstall">
    <ol class="ld-ios" id="ldIos" hidden>
      <li><svg><use href="#i-ios-share"/></svg><span data-i18n="ldIos1">分享</span></li>
      <li><svg><use href="#i-ios-add"/></svg><span data-i18n="ldIos2">加入主畫面</span></li>
      <li><b data-i18n="iosAdd">新增</b><span data-i18n="ldIos3">右上角</span></li>
    </ol>
    <p class="ld-menu" id="ldMenu" hidden></p>
    <button class="btn primary ld-go" id="ldGo" data-i18n="liteGo" hidden>加到主畫面</button>
    <a class="btn primary ld-go" id="ldOpenApp" data-i18n="openInApp" hidden>用 App 打開</a>
  </div>
  <!-- 電腦：右邊一張連結卡，複製連結到手機打開（收到的線就是那條線的連結） -->
  <div class="ld-link" id="ldLink" hidden>
    <div class="ld-link-content" id="ldLinkContent">
      <input id="ldLinkUrl" type="url" readonly data-i18n-aria="shareLink" aria-label="連結">
      <button class="btn" id="ldLinkCopy" data-i18n="pcCopyLink">複製連結</button>
    </div>
    <b id="ldLinkTitle" data-i18n="pcScan">用手機打開，馬上開始玩</b>
  </div>
  <!-- 首次開場：可拍照新增牆面，或從找牆面收下公開牆；取消選照片仍留在開場。 -->
  <div class="ld-start" id="ldStart">
    <button class="btn primary ld-go" id="ldPlay" data-i18n="ldPlay">開始拍</button>
    <button class="text-btn" id="ldFind" data-i18n="findWalls" hidden>找牆面</button>
  </div>
  <div class="ld-done" id="ldDone" hidden><img src="../icons/cats/hold-cat-192.png" alt=""><b data-i18n="ldInstalledT">裝好了！</b><span data-i18n="ldInstalled">從主畫面打開岩點貓</span></div>
</section>
<div class="ak-hint inst-bar" id="instBar" hidden><button class="ak-hint-go" id="instGo"><svg><use href="#i-ios-add"/></svg><span data-i18n="liteGo">加到主畫面</span></button><button class="ak-hint-x vw-btn inst-x" id="instX" data-i18n-aria="close" aria-label="關閉"><svg><use href="#i-plus"/></svg></button></div>
<div class="sam-prog" id="samProg" role="status" hidden><span id="samProgText"></span><i><b id="samProgBar"></b></i></div>
